<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA — CRM</title><link rel="stylesheet" href="styles.css"><style>
.staff-shell{max-width:1300px;margin:40px auto;padding:24px}.staff-box{max-width:440px;margin:10vh auto;border:1px solid #ddd;padding:32px;background:#fff}.staff-box label{display:block;margin:18px 0}.staff-box input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #aaa}.staff-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.staff-controls{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.staff-controls button,.staff-controls select,.stage-select{padding:9px;border:1px solid #aaa;background:#fff}.staff-table{width:100%;border-collapse:collapse}.staff-table th,.staff-table td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.staff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.staff-col{background:#f5f3ef;padding:16px}.staff-lead{background:white;border:1px solid #ddd;padding:14px;margin-bottom:12px}.staff-lead button{min-height:44px}.staff-panel{padding:20px;border:1px solid #ccc;background:#fff}.staff-panel textarea{width:100%;min-height:72px}#staff-feedback{min-height:24px;color:#9a3a32}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b58342;outline-offset:2px}@media(max-width:768px){.staff-shell{padding:15px}.staff-grid{grid-template-columns:1fr}.staff-table{display:block;overflow-x:auto}}
</style></head><body><div class="staff-shell"><div class="staff-top"><a class="brand" href="/">F FORMA.</a><span class="demo-label">CRM · SINGLE COMPANY</span></div>
<section id="login" class="staff-box"><h1>Xodimlar kirishi</h1><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Parol<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-dark" type="submit">Kirish</button></form><p id="login-error" role="alert"></p></section>
<main id="workspace" hidden><header class="staff-top"><div><p class="eyebrow">CRM / SAVDO</p><h1>Murojaatlar</h1><span id="who"></span></div><button id="logout" class="btn">Chiqish</button></header><div class="staff-controls"><label for="days">Davr</label><select id="days"><option value="7">7 kun</option><option value="30" selected>30 kun</option><option value="90">90 kun</option></select><button id="refresh">Yangilash</button><button id="dashboard-btn">Dashboard</button><button id="kanban-btn">Kanban</button><button id="list-btn">Mijozlar</button></div><p id="staff-feedback" role="status" aria-live="polite"></p><section id="dashboard"><h2>Dashboard</h2><div id="kpis" class="stat-grid"></div><h3>Murojaatlar dinamikasi (7 segment, ta)</h3><div id="live-chart" class="bar-chart" role="img"></div><h3>Savdo voronkasi</h3><div id="live-funnel"></div><h3>Xonadonlar holati</h3><div id="unit-status"></div></section><section id="board" hidden><h2>Kanban</h2><p>Ruxsat etilgan bosqichni tugma yoki ro‘yxat bilan tanlang. Sotuvni tasdiqlash bu yerda mavjud emas.</p><div id="live-kanban" class="staff-grid"></div></section><section id="people" hidden><h2>Mijozlar</h2><div id="live-contacts"></div></section><section id="history" class="staff-panel" hidden><h2 id="history-title">Mijoz tarixi</h2><div id="events"></div><form id="note-form"><label for="note">Ichki eslatma (tashqi chat emas)</label><textarea id="note" required maxlength="1000"></textarea><button class="btn" type="submit">Eslatmani saqlash</button></form><button id="close-history">Yopish</button></section></main></div><script src="staff.js" defer></script></body></html>
